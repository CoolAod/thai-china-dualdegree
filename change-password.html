<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เปลี่ยนรหัสผ่าน | ระบบทวิวุฒิ ไทย–จีน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0B3E8F; --blue-700:#2563EB; --blue-600:#3B82F6; --cyan-400:#38BDF8;
    --indigo-500:#4F46E5; --sky-50:#F3F7FF; --sky-100:#EAF1FF;
    --ink-900:#12213D; --ink-600:#4C5C77; --ink-400:#8494AC; --line:#E1E9F7;
    --red-500:#E5484D; --red-50:#FDECEC; --green:#22C08D;
    --radius-lg:20px; --shadow-soft:0 20px 50px -20px rgba(23,60,140,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Prompt','Sarabun',sans-serif;min-height:100vh;color:var(--ink-900);
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(79,142,247,.35), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(56,189,248,.3), transparent 55%),
      linear-gradient(135deg,#0B3E8F 0%, #2563EB 45%, #38BDF8 100%);
  }
  .card{
    width:100%;max-width:440px;background:#fff;border-radius:26px;box-shadow:var(--shadow-soft);padding:40px 36px;
  }
  .brand-badge{
    width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--blue-700),var(--cyan-400));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;margin-bottom:18px;
  }
  h1{font-size:19px;margin:0 0 6px;font-weight:700;}
  p.lead{font-size:13px;color:var(--ink-400);margin:0 0 26px;}
  label{font-size:12.5px;color:var(--ink-600);font-weight:500;display:block;margin-bottom:7px;}
  .field{margin-bottom:16px;}
  .input-wrap{
    display:flex;align-items:center;border:1.6px solid var(--line);border-radius:12px;padding:0 14px;background:var(--sky-50);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap:focus-within{border-color:var(--blue-600); box-shadow:0 0 0 4px rgba(59,130,246,.13);}
  .input-wrap input{border:none;background:transparent;outline:none;width:100%;font-family:inherit;font-size:14px;padding:12px 0;color:var(--ink-900);}
  .hint{font-size:11px;color:var(--ink-400);margin-top:6px;}
  .btn{width:100%;padding:13px;border:none;border-radius:12px;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer;}
  .btn-primary{background:linear-gradient(135deg,var(--blue-700),var(--indigo-500));color:#fff;box-shadow:0 14px 28px -10px rgba(37,99,235,.55);}
  .btn-primary:disabled{opacity:.7;cursor:progress;}
  .msg-box{
    display:none;align-items:center;gap:10px;border-radius:11px;padding:11px 14px;font-size:12.5px;margin-bottom:18px;font-weight:500;
  }
  .msg-box.error{background:var(--red-50);color:var(--red-500);}
  .msg-box.success{background:#E9F9F2;color:#1AA179;}
  .msg-box.show{display:flex;}
  .back-link{margin-top:20px;text-align:center;font-size:12.5px;color:var(--ink-400);}
  .back-link a{color:var(--blue-700);font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="brand-badge">TC</div>
  <h1>เปลี่ยนรหัสผ่านผู้ดูแลระบบ</h1>
  <p class="lead">ตั้งรหัสผ่านใหม่สำหรับบัญชีที่ล็อกอินอยู่ในขณะนี้</p>

  <div class="msg-box" id="msgBox"><span id="msgText"></span></div>

  <form id="changeForm" novalidate>
    <div class="field">
      <label for="oldPassword">รหัสผ่านเดิม</label>
      <div class="input-wrap"><input type="password" id="oldPassword" placeholder="••••••••" required></div>
    </div>
    <div class="field">
      <label for="newPassword">รหัสผ่านใหม่</label>
      <div class="input-wrap"><input type="password" id="newPassword" placeholder="อย่างน้อย 8 ตัวอักษร" required></div>
    </div>
    <div class="field">
      <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
      <div class="input-wrap"><input type="password" id="confirmPassword" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง" required></div>
      <div class="hint">รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร แนะนำให้ผสมตัวเลขและตัวอักษร</div>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">บันทึกรหัสผ่านใหม่</button>
  </form>

  <div class="back-link"><a href="dashboard.html">‹ กลับสู่แดชบอร์ด</a></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzsmHqHOdrpFG_VAkRMw4cjT7whIu76K469UsbnJbR5Z_iScKheSfQO2tpurw0FgLiW8A/exec";
  const ADMIN_TOKEN = sessionStorage.getItem('tc_admin_token') || '';

  if(!ADMIN_TOKEN){
    // ไม่ได้ล็อกอิน — ส่งกลับไปหน้า login ทันที เพราะหน้านี้ต้องมี session เท่านั้น
    location.href = 'login.html';
  }

  function showMsg(text, type){
    const box = document.getElementById('msgBox');
    const t = document.getElementById('msgText');
    t.textContent = text;
    box.className = 'msg-box show ' + type;
  }

  document.getElementById('changeForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const oldPassword = document.getElementById('oldPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if(!oldPassword || !newPassword || !confirmPassword){
      showMsg('กรุณากรอกข้อมูลให้ครบทุกช่อง', 'error'); return;
    }
    if(newPassword.length < 8){
      showMsg('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัวอักษร', 'error'); return;
    }
    if(newPassword !== confirmPassword){
      showMsg('รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน', 'error'); return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try{
      const res = await fetch(API_URL, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'changePassword', token: ADMIN_TOKEN, oldPassword, newPassword })
      });
      const data = await res.json();
      if(data.success){
        showMsg('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว กำลังพาไปหน้าแดชบอร์ด...', 'success');
        setTimeout(()=> location.href = 'dashboard.html', 1500);
      } else {
        showMsg(data.message || 'เปลี่ยนรหัสผ่านไม่สำเร็จ', 'error');
      }
    }catch(err){
      showMsg('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ต', 'error');
    }finally{
      btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่';
    }
  });
</script>
</body>
</html>
